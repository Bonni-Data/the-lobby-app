# THE LOBBY · preview of the public pages, without publishing them on the site.
# Runs on pushes to the site-preview branch and saves the result on the site-preview-out branch.
name: Anteprima pagine pubbliche

on:
  workflow_dispatch:
  push:
    branches: [site-preview]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Bonni-Data/the-lobby-posts
          path: posts
          sparse-checkout: |
            data
            history-notizie.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/scripts/site.mjs --out out --posts posts
      - name: Save the preview on site-preview-out
        working-directory: out
        run: |
          git init -q -b site-preview-out
          git config user.name "THE LOBBY bot"
          git config user.email "thelobbysupport@gmail.com"
          git add -A
          git commit -q -m "Anteprima $(date -u +%Y-%m-%dT%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:site-preview-out
